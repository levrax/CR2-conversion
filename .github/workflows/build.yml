# Сборка и релиз конвертера CR2 (Windows + macOS).
#
# PyInstaller НЕ УМЕЕТ кросс-компиляцию: каждую ОС надо собирать на её же
# раннере. Отсюда матрица из трёх задач.
name: Build and release

on:
  push:
    # ТОЛЬКО основная ветка. При branches: ['**'] пуш в ветку с открытым PR
    # запускает и push, и pull_request - а group концуррентности содержит
    # github.ref, который у этих событий РАЗНЫЙ (refs/heads/X против
    # refs/pull/N/merge), так что ни один прогон не отменяет другой: 6 задач
    # вместо 3, включая два macOS-раннера по множителю x10.
    branches: [main]
    # Фильтр веток НЕ срабатывает на пуш тега - теги надо перечислять отдельно.
    # Шаблон сужен до версии: 'v*' ловил и черновые теги (vnext, verify-ci),
    # каждый из которых публиковал НАСТОЯЩИЙ релиз с бинарниками.
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:

# По умолчанию токен только на чтение; права на запись поднимает лишь job release.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Сборку тега никогда не отменяем на полпути.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: '3.12'

defaults:
  run:
    # bash есть на всех раннерах (на Windows - Git Bash), один синтаксис везде.
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # 1. Тесты + сборка. Одна задача на ОС/архитектуру.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.slug }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # На windows-latest локаль en-US, ACP=1252, а вывод шага уходит в канал,
      # поэтому Python берёт кодировку локали и ЛЮБОЙ print() с кириллицей в
      # шагах ниже падает с UnicodeEncodeError - в том числе на успешном пути.
      # Именно PYTHONIOENCODING, а не PYTHONUTF8=1: последний меняет ещё и
      # кодировку open() по умолчанию, а тесты намеренно читают файлы не в
      # UTF-8 (test_settings_survive_a_non_utf8_rewrite).
      # NB: на ЗАМОРОЖЕННЫЙ exe это не влияет - PyInstaller стартует CPython с
      # use_environment=0, см. дымовой тест ниже.
      PYTHONIOENCODING: 'utf-8'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slug: windows-x64
            arch: x64
          - os: macos-latest
            slug: macos-arm64
            arch: arm64
          # Intel-раннер. Образ macos-13 снят с обслуживания 04.12.2025,
          # штатная замена для x86_64 - macos-15-intel.
          - os: macos-15-intel
            slug: macos-x86_64
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Кэшируется загрузочный кэш pip (колёса), а не site-packages:
          # установка всё равно выполняется, но без похода в сеть и без сборки
          # из исходников. Больше всего это экономит на macos-15-intel, где
          # rawpy тянется старым колесом.
          #
          # ОСТОРОЖНО: `cache: pip` ищет **/requirements.txt (запасной вариант
          # **/pyproject.toml) и ПАДАЕТ, если не нашёл ничего. Пока в корне
          # лежит requirements.txt, шаг безопасен; при переименовании файла
          # правьте и эту строку.
          cache: pip
          cache-dependency-path: requirements.txt

      # Установка ЖЁСТКАЯ: никаких «поставим по одному и продолжим».
      # Раньше здесь был цикл, который при неудаче ставил пакеты по одному и
      # печатал только ::warning::. На macOS x86_64 rawpy не вставал никогда
      # (см. комментарий в requirements.txt), и релиз получал ассет
      # -macos-x86_64.zip без режима проявки RAW - внешне неотличимый от
      # arm64. Верхняя граница rawpy для Intel теперь стоит прямо в
      # requirements.txt, так что подстраховка не нужна: если установка
      # падает, это настоящая поломка, и её надо видеть.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Верхняя граница не для красоты: в 7.0 PyInstaller обещает сделать
          # ошибками то, что сейчас лишь предупреждения (например, onefile
          # вместе с .app), и менять раскладку бандла. Незакреплённый
          # `pip install pyinstaller` однажды сломает сборку в день выхода
          # мажорной версии, без единой правки в репозитории.
          python -m pip install 'pyinstaller>=6.10,<7'
          python -m pip list

      - name: Show toolchain
        run: |
          python -VV
          python -c "import platform, _tkinter; print('machine:', platform.machine(), 'Tcl', _tkinter.TCL_VERSION, 'Tk', _tkinter.TK_VERSION)"
          pyinstaller --version

      # Отдельно от установки: пакет может «поставиться» и не импортироваться
      # (несовпадение ABI, битое колесо). Доустановить его в готовый .exe/.app
      # пользователь не сможет, поэтому проверка обязана падать, а не предупреждать.
      - name: Verify runtime deps are importable
        run: |
          python - <<'PY'
          import importlib, sys
          missing = []
          for mod in ("PIL", "numpy", "rawpy"):
              try:
                  importlib.import_module(mod)
              except BaseException as exc:
                  missing.append("%s (%s)" % (mod, exc))
          if missing:
              print("::error::в сборку не попадут: %s" % ", ".join(missing))
              sys.exit(1)
          print("PIL, numpy, rawpy - все импортируются")
          PY

      # test_window_builds_and_closes (test_cli_gui.py) при любой ошибке Tk
      # вызывает self.skipTest - и это правильно для машины разработчика, но в
      # CI означает, что сломанный Tk НЕ КРАСИТ сборку в красный: единственный
      # тест, который реально собирает окно, молча пропускается, и так может
      # продолжаться месяцами. На windows-latest есть оконная станция, на
      # macOS-раннерах - настоящая сессия Aqua, так что окно обязано
      # открываться на обеих платформах; если нет - это поломка, а не повод
      # для пропуска.
      - name: Assert Tk can actually open a window
        run: |
          python - <<'PY'
          import sys, tkinter
          try:
              root = tkinter.Tk()
          except BaseException as exc:
              print("::error::Tk не работает (%s) - тесты GUI молча пропустятся" % exc)
              sys.exit(1)
          root.withdraw()
          root.update()
          root.destroy()
          print("Tk", tkinter.TkVersion, "- окно открывается")
          PY

      # Тесты идут ДО сборки и валят задачу при любой ошибке.
      - name: Run test suite
        run: python -m unittest discover -v -t . -s . -p "test_*.py"

      - name: Resolve version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0+${GITHUB_SHA:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Locate the .spec file
        id: spec
        run: |
          if [ -f cr2app.spec ]; then
            spec=cr2app.spec
          else
            # `|| true` обязателен: shell здесь - bash -eo pipefail, ls без
            # совпадений возвращает 2, pipefail протаскивает это через head, а
            # присваивание наследует код пайплайна. Шаг умирал прямо здесь, с
            # кодом 2 и ПУСТЫМ логом, так и не дойдя до строки ::error:: ниже,
            # ради которой он и написан.
            spec="$(ls -1 *.spec | head -n 1 || true)"
          fi
          if [ -z "$spec" ]; then
            echo "::error::В корне репозитория нет .spec файла для PyInstaller"
            exit 1
          fi
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          echo "Using spec: $spec"

      - name: Build with PyInstaller
        env:
          # Без этого версия тега доезжала только до ИМЕНИ архива: спека
          # держала зашитое "1.0.0", и каждый релиз выпускал .app с
          # CFBundleShortVersionString=1.0.0, а exe - вообще без ресурса версии.
          APP_VERSION: ${{ steps.ver.outputs.version }}
          # Валить сборку, если Pillow/rawpy/numpy не попали в граф.
          CR2_REQUIRE_FULL_BUILD: '1'
        run: |
          python -m PyInstaller --noconfirm --clean --log-level=INFO "${{ steps.spec.outputs.spec }}"
          ls -la dist

      # Дымовой тест собранного бандла. Консольный exe для того и собирается.
      # ВАЖНО: сравнивать текст через grep нельзя - замороженный CLI пишет в
      # кодировке ANSI-страницы системы и НЕ слушает ни PYTHONIOENCODING, ни
      # PYTHONUTF8 (PyInstaller стартует CPython с use_environment=0).
      # Декодируем явно. Код возврата --version равен 0 и в урезанном случае.
      #
      # И второе, менее очевидное: Console в cr2_convert.py САМ транслитерирует
      # кириллицу, если она не лезет в кодировку потока (cyrillic = _can("Я")).
      # На раннере GitHub локаль en-US, ACP=1252, 'Я'.encode('cp1252') падает -
      # и «есть» выходит как «est». Поэтому принимаем ОБА написания маркера.
      # «нет» транслитерируется в «net», так что проверка по-прежнему отличает
      # полный бандл от урезанного, а не просто всегда зелёная.
      - name: Smoke-test the built bundle
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            exe="dist/CR2 Converter/CR2 Converter CLI.exe"
          else
            exe="dist/CR2 Converter.app/Contents/MacOS/CR2 Converter CLI"
          fi
          python - "$exe" <<'PY'
          import re, subprocess, sys
          out = subprocess.run([sys.argv[1], "--version"],
                               capture_output=True, check=True).stdout
          # cp866 ДО cp1251: cp1251 декодирует почти любой байтовый мусор и
          # молча увёл бы cp866-вывод в кракозябры вместо перехода к следующей.
          for enc in ("utf-8", "cp866", "cp1251"):
              try:
                  text = out.decode(enc)
                  break
              except UnicodeDecodeError:
                  continue
          else:
              sys.exit("не удалось декодировать вывод: %r" % out)
          print(text.strip())
          for dep in ("Pillow", "rawpy"):
              m = re.search(r"%s: (есть|est|нет|net)" % dep, text)
              if m is None:
                  sys.exit("::error::в выводе --version нет строки про %s "
                           "(вывод: %s)" % (dep, text.strip()))
              if m.group(1) in ("нет", "net"):
                  sys.exit("::error::%s отсутствует в собранном бандле "
                           "(вывод: %s)" % (dep, text.strip()))
          PY

      # LSBackgroundOnly=true делает .app фоновым агентом: ни значка в Dock, ни
      # меню, окно Tk нельзя вынести на передний план - пользователь видит, что
      # по двойному щелчку «ничего не происходит», и в журнале при этом пусто.
      # Значение приезжает само, от console=True у консольного exe в том же
      # COLLECT, поэтому проверяем готовый файл, а не намерение.
      - name: Verify the .app Info.plist
        if: runner.os == 'macOS'
        run: |
          app="$(find dist -mindepth 1 -maxdepth 1 -name '*.app' | head -n 1 || true)"
          if [ -z "$app" ]; then
            echo "::error::.app бандл в dist не найден"
            exit 1
          fi
          plist="$app/Contents/Info.plist"
          plutil -p "$plist"
          if /usr/libexec/PlistBuddy -c 'Print :LSBackgroundOnly' "$plist" 2>/dev/null | grep -qi true; then
            echo "::error::Info.plist содержит LSBackgroundOnly=true - бандл запустится фоновым агентом"
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print :NSHighResolutionCapable' "$plist" 2>/dev/null | grep -qi true; then
            echo "::error::Info.plist без NSHighResolutionCapable - окно будет мыльным на retina"
            exit 1
          fi

      # --- Упаковка: Windows ---------------------------------------------------
      - name: Package (Windows, zip onedir)
        if: runner.os == 'Windows'
        run: |
          mkdir -p artifacts
          # `|| true`: без него сбой find/head убил бы шаг раньше, чем
          # отработает проверка с ::error:: ниже (bash -eo pipefail).
          app="$(find dist -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
          if [ -z "$app" ]; then
            echo "::error::onedir-папка в dist не найдена"
            exit 1
          fi
          appname="$(basename "$app")"
          # Имя ассета GitHub нормализует при заливке: пробелы (и `+`)
          # заменяются точками, а SHA256SUMS.txt публикуется как есть - после
          # чего `sha256sum -c` не находит НИ ОДНОГО файла. Пробел убираем сами.
          safename="${appname// /-}"
          out="artifacts/$safename-${{ steps.ver.outputs.version }}-windows-x64.zip"
          # 7-Zip предустановлен на образе windows; сохраняем верхнюю папку,
          # чтобы распаковка не рассыпала сотни файлов в Downloads.
          # ВНИМАНИЕ: источник для 7z - "$appname" (С пробелом), это реальный
          # путь в dist; подменять его на $safename нельзя, папки такой нет.
          7z a -tzip -mx=9 "$out" "./dist/$appname" > /dev/null
          7z l "$out" | tail -n 3

      # --- Упаковка: macOS -----------------------------------------------------
      - name: Package (macOS, ditto .app)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          app="$(find dist -mindepth 1 -maxdepth 1 -name '*.app' | head -n 1 || true)"
          if [ -z "$app" ]; then
            echo "::error::.app бандл в dist не найден"
            exit 1
          fi
          appname="$(basename "$app" .app)"
          # См. комментарий в windows-шаге: GitHub заменит пробел точкой при
          # заливке, и SHA256SUMS.txt перестанет сходиться с именами ассетов.
          safename="${appname// /-}"
          out="artifacts/$safename-${{ steps.ver.outputs.version }}-macos-${{ matrix.arch }}.zip"
          codesign --display --verbose=2 "$app" || true
          # ditto, а НЕ zip: внутри .app симлинки (Frameworks/Resources связаны
          # перекрёстно) и расширенные атрибуты с подписью. zip их теряет,
          # после чего бандл может не запуститься на Apple Silicon.
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$out"
          unzip -l "$out" | tail -n 3

      - name: Checksums
        run: |
          tmp="$(mktemp)"
          (
            cd artifacts
            for f in *; do
              if [ -f "$f" ]; then
                if command -v sha256sum > /dev/null 2>&1; then
                  sha256sum "$f"
                else
                  shasum -a 256 "$f"
                fi
              fi
            done
          ) > "$tmp"
          mv "$tmp" "artifacts/SHA256SUMS-${{ matrix.slug }}.txt"
          cat "artifacts/SHA256SUMS-${{ matrix.slug }}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          # Имя артефакта обязано быть уникальным внутри одного запуска.
          name: CR2-${{ matrix.slug }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # ---------------------------------------------------------------------------
  # 2. Релиз: только на тег v* и только когда вся матрица зелёная.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build]
    # Именно ПУШ тега, а не «ref похож на тег».  Диалог Run workflow позволяет
    # выбрать тег, и тогда github.ref тоже был бы refs/tags/vX: ручной запуск
    # «перепроверить сборку под macOS» публиковал бы публичный релиз, чего
    # никто от этой кнопки не ждёт.  Матрица сборки при dispatch по-прежнему
    # отрабатывает полностью - запрещена только публикация.
    if: >-
      github.event_name == 'push'
      && github.ref_type == 'tag'
      && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Язык выражений в `if:` не умеет регулярных выражений, поэтому форму
      # тега проверяем здесь, до первой публикующей команды.  Фильтр в on.push
      # уже сузил запуск, но тег можно навесить и на ручной прогон, а цена
      # ошибки - публичный релиз с бинарниками, который увидят все.
      - name: Reject tags that are not vN.N.N
        run: |
          tag="$GITHUB_REF_NAME"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Тег $tag не похож на версию (ожидается vN.N.N) - релиз не публикуется"
            exit 1
          fi

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          pattern: CR2-*
          merge-multiple: true

      - name: List assets
        run: ls -lR dist-artifacts

      - name: Merge checksum files
        run: |
          cd dist-artifacts
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt
          cat SHA256SUMS.txt

      - name: Create release and attach every platform build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # gh делает draft -> заливает файлы -> публикует; только такой порядок
        # работает в репозиториях с включёнными immutable releases.
        #
        # Шаг должен переживать повторный запуск. gh release create отказывает
        # на теге, у которого релиз уже есть, а заливка файлов идёт ПОСЛЕ
        # создания черновика - то есть оборванная загрузка (502 на архиве в
        # 200 МБ) оставляет недозаполненный черновик, и «Re-run failed jobs»
        # либо падает, либо плодит ещё один черновик на тот же тег.
        # Черновик от упавшего запуска удаляем, опубликованный релиз - никогда:
        # при immutable releases ассеты в него всё равно не дописать, и молча
        # снести чужой релиз хуже, чем громко остановиться.
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            echo "::warning::Найден черновик релиза $tag от упавшего запуска - удаляю и создаю заново"
            gh release delete "$tag" --yes        # тег НЕ трогаем: без --cleanup-tag
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Релиз $tag уже опубликован. Дописать ассеты нельзя: удалите релиз (gh release delete $tag) или выпустите новый тег."
            exit 1
          fi
          gh release create "$tag" dist-artifacts/* \
            --title "$tag" \
            --generate-notes \
            --verify-tag
